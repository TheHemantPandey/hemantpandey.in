    <!-- Default metadata — overridden per-page by react-helmet-async -->
    <title>Hemant Pandey | Full Stack Developer & Software Developer</title>
    <meta name="description" content="Hemant Pandey is a Full Stack Developer building modern web applications, mobile apps, and production-ready digital products using React, Next.js, Node.js, and the MERN stack." />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="PASTE_GSC_VERIFICATION_TOKEN_HERE" />

    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme') || 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = stored === 'system' ? (systemDark ? 'dark' : 'light') : stored;
          document.documentElement.className = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
